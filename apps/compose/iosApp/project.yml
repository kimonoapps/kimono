# The iPhone app. Generate the Xcode project with `xcodegen` (it isn't committed).
name: Kimono
options:
  bundleIdPrefix: app.kimono
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Kimono:
    type: application
    platform: iOS
    sources:
      - Kimono
      # The app's background uploads sign in the same way as the Files extension,
      # and its thumbnails come from the same place (and the same cache).
      - KimonoFiles/Drive.swift
      - KimonoFiles/Thumbnails.swift
    dependencies:
      - target: KimonoFiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kimono.compose
        PRODUCT_NAME: Kimono
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Kimono/Kimono.entitlements
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "Shared"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1"
        # The shared framework is built for Apple silicon simulators only.
        "ARCHS[sdk=iphonesimulator*]": arm64
      configs:
        Debug:
          # Debug builds switch Kimono on in the Files app by themselves, for testing.
          CODE_SIGN_ENTITLEMENTS: Kimono/Kimono-Debug.entitlements
    info:
      path: Kimono/Info.plist
      properties:
        CFBundleDisplayName: Kimono
        # The release's numbers (MARKETING_VERSION, CURRENT_PROJECT_VERSION), never a fixed 1.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Only standard HTTPS: TestFlight builds go out without the export questions.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        KimonoKeychainGroup: "$(AppIdentifierPrefix)app.kimono.shared"
        NSPhotoLibraryUsageDescription: Pick photos to attach, or one for your portrait.
        NSCameraUsageDescription: Take a photo or video to attach.
        NSMicrophoneUsageDescription: Record sound with a video you attach.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@21}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  KimonoFiles:
    type: app-extension
    platform: iOS
    sources:
      - KimonoFiles
      # The Files app shows the extension's own icon beside "Kimono".
      - path: Kimono/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.kimono.compose.files
        PRODUCT_NAME: KimonoFiles
        CODE_SIGN_ENTITLEMENTS: KimonoFiles/KimonoFiles.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: KimonoFiles/Info.plist
      properties:
        CFBundleDisplayName: Kimono
        # The release's numbers (MARKETING_VERSION, CURRENT_PROJECT_VERSION), never a fixed 1.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KimonoKeychainGroup: "$(AppIdentifierPrefix)app.kimono.shared"
        # The icon beside "Kimono" in the Files app: a symbol, not the app icon.
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: kimono.blossom
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: group.app.kimono
          NSExtensionFileProviderSupportsEnumeration: true
