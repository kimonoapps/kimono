<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kimono</title>
<style>
  :root { --paper: #f7f1e8; --plum: #4e2b37; --faint: #6b605a; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1c1719; --plum: #f2cbd2; --faint: #a8969c; }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--paper); color: var(--plum);
    font-family: "Zen Maru Gothic", ui-rounded, system-ui, sans-serif;
  }
  main { display: grid; justify-items: center; gap: 22px; }
  /* As the Portal's .ink-loader in shell.css. */
  .ink-loader { width: 56px; height: 56px; overflow: visible; opacity: 0; animation: loader-in 200ms cubic-bezier(.05, .7, .1, 1) 250ms forwards; }
  @keyframes loader-in { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
  /* Only after a long wait, so a quick boot is just the loader. Fixed below
     the centre, so the loader never moves when it appears. */
  p { position: fixed; top: calc(50% + 56px); left: 50%; width: max-content; max-width: calc(100vw - 32px); margin: 0; translate: -50% 0;
    font-size: 14px; color: var(--faint); text-align: center; opacity: 0; transition: opacity 400ms ease; }
  p.shown { opacity: 1; }
</style>
</head>
<body>
<main>
  <!-- The Portal's InkLoader (components/ink-loader.tsx), by hand: this page is
       served by Caddy before the Portal is up, so it cannot use React. -->
  <svg class="ink-loader" viewBox="0 0 38 38" role="progressbar" aria-label="Loading">
    <defs>
      <filter id="ink-fine" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".08" numOctaves="2" seed="28" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>
      <filter id="ink-wash" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".02 .06" numOctaves="3" seed="26" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7" result="d"/><feGaussianBlur in="d" stdDeviation=".6"/></filter>
      <radialGradient id="lw" cx="50%" cy="60%" r="75%"><stop offset="0" stop-color="#fff8f4"/><stop offset=".5" stop-color="#eab0be"/><stop offset=".9" stop-color="#cf7088"/><stop offset="1" stop-color="#8f3c52"/></radialGradient>
    </defs>
    <path class="shape" fill="url(#lw)" filter="url(#ink-wash)" opacity=".95"/>
    <path class="shape" fill="none" stroke="#4e2b37" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="70 4" opacity=".8" filter="url(#ink-fine)"/>
  </svg>
  <p role="status"></p>
</main>
<script>
  /* Material 3 Expressive's loading indicator, painted: soft burst, cookie,
     pentagon, pill, sunny, clover, oval, each a radius r(θ), blended pairwise. */
  const SHAPES = [
    (t) => .86 + .14 * Math.pow(Math.abs(Math.cos(5 * t)), .6),
    (t) => .9 + .1 * Math.cos(9 * t),
    (t) => { const k = Math.PI / 5, a = ((t % (2 * k)) + 2 * k) % (2 * k) - k; return .7 * (Math.cos(k) / Math.cos(a)) + .27; },
    (t) => .62 / Math.hypot(.62 * Math.cos(t), Math.sin(t)),
    (t) => .9 + .1 * Math.sign(Math.cos(8 * t)) * Math.pow(Math.abs(Math.cos(8 * t)), .45),
    (t) => .76 + .24 * Math.pow(Math.abs(Math.cos(2 * t)), 1.6),
    (t) => .8 / Math.hypot(.8 * Math.cos(t), Math.sin(t)),
  ];
  const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  function shapePath(i, j, mix) {
    let d = "";
    for (let k = 0; k <= 120; k++) {
      const t = k / 120 * Math.PI * 2, r = (SHAPES[i](t) * (1 - mix) + SHAPES[j](t) * mix) * 17.5;
      d += (k ? "L" : "M") + (19 + r * Math.cos(t)).toFixed(2) + " " + (19 + r * Math.sin(t)).toFixed(2);
    }
    return d + "Z";
  }
  const root = document.querySelector(".ink-loader");
  const paths = root.querySelectorAll("path.shape");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    paths.forEach((p) => p.setAttribute("d", shapePath(0, 0, 0)));
  } else {
    const HOLD = 120, MORPH = 520, start = performance.now();
    let angle = 0, last = start;
    const frame = (now) => {
      const elapsed = Math.max(0, now - start), phase = elapsed % (HOLD + MORPH), mix = phase < HOLD ? 0 : ease((phase - HOLD) / MORPH);
      const current = Math.floor(elapsed / (HOLD + MORPH)) % SHAPES.length;
      angle += Math.max(0, now - last) * (.18 + .5 * (phase < HOLD ? 0 : Math.sin(mix * Math.PI))); last = now;
      const d = shapePath(current, (current + 1) % SHAPES.length, mix);
      paths.forEach((p) => p.setAttribute("d", d));
      root.style.transform = `rotate(${angle.toFixed(1)}deg)`;
      requestAnimationFrame(frame);
    };
    paths.forEach((p) => p.setAttribute("d", shapePath(0, 1, 0)));
    requestAnimationFrame(frame);
  }

  /* Caddy marks this page with a header while the Portal is still coming up;
     a response without it means the Portal answered. */
  async function check() {
    try {
      const r = await fetch(location.href, { cache: "no-store", redirect: "manual" });
      if (!r.headers.get("x-kimono-starting")) { location.reload(); return; }
    } catch {}
    setTimeout(check, 2500);
  }
  setTimeout(check, 2500);

  setTimeout(() => {
    const note = document.querySelector("p");
    note.textContent = "Hmm, this is taking a while. Kimono can take a few minutes to wake up the first time.";
    note.classList.add("shown");
  }, 15000);
</script>
</body>
</html>
