.dv-ba ul { margin: 0; padding: 0; list-style: none; font-size: 13px; color: var(--k-ink-soft); }
.dv-ba li { display: flex; align-items: center; gap: 8px; min-height: 30px; border-top: 1px solid var(--k-hair); }
.dv-ba li:first-child { border-top: 0; }
.dv-ba li.gone { text-decoration: line-through; text-decoration-color: var(--k-suo); color: var(--k-faint); }
.dv-ba li.new { color: var(--k-ink); font-weight: 600; }
.dv-ba li em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--k-ink-soft); }
.dv-ppl { display: grid; gap: 0; }
.dv-ppl label { display: grid; grid-template-columns: 22px 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; border-bottom: 1px solid var(--k-hair); font-size: 14px; }
.dv-ppl label:last-child { border-bottom: 0; }
.dv-ppl label small { color: var(--k-ink-soft); font-size: 12.5px; }
.dv-ppl label.off b { color: var(--k-faint); text-decoration: line-through; }
.dv-ppl label .after { font-size: 12.5px; color: var(--k-ink-soft); }
.dv-ppl label.off .after { color: var(--k-suo-deep); }
.dv-summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--k-hair); border-radius: 2px; background: var(--k-lift); }
.dv-summary > div { padding: 12px 16px; }
.dv-summary > div + div { border-left: 1px solid var(--k-hair); }
.dv-summary b { display: block; font: 600 21px/1.2 var(--k-display); color: var(--k-plum); }
.dv-summary small { font-size: 12.5px; color: var(--k-ink-soft); }

/* icon picker */
.dv-picker { display: grid; grid-template-columns: repeat(8, 44px); gap: 8px; }
.dv-picker button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--k-hair); border-radius: 2px; background: var(--k-fold); color: var(--k-ink); cursor: pointer; }
.dv-picker button[aria-pressed="true"] { border-color: var(--k-ink); background: var(--k-lift); box-shadow: inset 0 -2px 0 var(--k-ink); }
.dv-picker button svg.i { width: 20px; height: 20px; }
.dv-styles { display: flex; gap: 14px; flex-wrap: wrap; }
.dv-styles label { display: grid; justify-items: center; gap: 6px; padding: 10px 14px; border: 1px solid var(--k-hair); border-radius: 2px; font-size: 12px; color: var(--k-ink-soft); cursor: pointer; background: var(--k-lift); }
.dv-styles label.on { border-color: var(--k-ink); color: var(--k-ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--k-ink); }

/* empty states */
.dv-empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 64px 24px; }
.dv-empty h3 { margin: 0; font: 600 24px/1.2 var(--k-display); color: var(--k-plum); }
.dv-empty p { margin: 0; max-width: 46ch; color: var(--k-ink-soft); font-size: 14px; }
.dv-empty .k-seal-group { justify-content: center; margin-top: 8px; }
.dv-states { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; }
.dv-states > .dv-sheet { padding: 0; }
.dv-state-label { padding: 10px 16px; border-bottom: 1px solid var(--k-hair); background: var(--k-ground); font: 600 12px/1.4 var(--k-sans); color: var(--k-ink-soft); }

/* trash */
.dv-trashnote { display: flex; align-items: center; gap: 16px; padding: 14px 32px; border-bottom: 1px solid var(--k-hair); font-size: 13.5px; color: var(--k-ink-soft); }
.dv-trashnote .k-seal { margin-left: auto; }

/* ═════ phones ═════ */
.dv.ph { display: flex; flex-direction: column; height: 100%; }
.ph-head { display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 12px 0 16px; background: var(--k-ground); position: relative; flex: none; }
.ph-head::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--k-plum); box-shadow: 0 1px 0 var(--k-sakura-soft); }
.ph-head .k-app-lockup-mark { width: 30px; height: 30px; }
.ph-head .k-app-lockup-word, .ph-head .k-app-lockup-name { font-size: 21px; }
.ph-head .end { margin-left: auto; display: flex; gap: 2px; }
.ph-head .dv-iconbtn { color: var(--k-ink-soft); }
.ph-title { padding: 16px 16px 10px; display: flex; align-items: center; gap: 12px; }
.ph-title h1 { margin: 0; font: 600 26px/1.15 var(--k-display); color: var(--k-plum); }
.ph-title small { display: block; font-size: 12.5px; color: var(--k-ink-soft); }
.ph-crumb { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; font-size: 13px; color: var(--k-ink-soft); font-weight: 600; }
.ph-body { flex: 1; overflow: hidden; position: relative; background-color: var(--k-sheet); background-image: var(--k-grain); border-top: 1px solid var(--k-hair); }
.ph-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 36px; gap: 12px; align-items: center; min-height: 62px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--k-hair); }
.ph-row.sel { background: var(--k-selected); }
.ph-row.wcheck { grid-template-columns: 22px 40px minmax(0, 1fr) 36px; }
.ph-row b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-row small { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--k-ink-soft); }
.ph-fab { position: absolute; right: 16px; bottom: 16px; z-index: 3; }
.ph-tabs { display: grid; grid-template-columns: repeat(4, 1fr); flex: none; border-top: 1px solid var(--k-hair); background: var(--k-ground); }
.ph-tabs a { display: grid; justify-items: center; gap: 2px; padding: 8px 0 14px; font-size: 11px; font-weight: 600; color: var(--k-ink-soft); position: relative; }
.ph-tabs a[aria-current] { color: var(--k-plum); }
.ph-tabs a[aria-current]::before { content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: var(--k-app-accent); }
.ph-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; border-top: 1px solid var(--k-hair); border-radius: 2px 2px 0 0; background: var(--k-lift); box-shadow: 0 -24px 48px -24px rgba(78,43,55,.45); }
.ph-sheet .grab { width: 40px; height: 4px; margin: 8px auto 4px; background: var(--k-hair-deep); border-radius: 2px; }
.ph-sheet h2 { margin: 0; font: 600 21px/1.2 var(--k-display); color: var(--k-plum); }
.ph-sheet .pad { padding: 10px 16px 16px; }
.ph-sheet .dv-addr { box-shadow: none; background: var(--k-fold); grid-template-columns: 1fr; margin-top: 10px; }
.ph-sheet .k-seal { width: 100%; }
.ph-sheet .dv-menu { position: static; width: auto; box-shadow: none; border: 0; padding: 4px 8px 12px; }
.ph-scrim { position: absolute; inset: 0; z-index: 4; background: rgba(42,29,34,.32); }
.ph-selbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--k-hair); background: var(--k-lift); }
.ph-selbar a { display: grid; justify-items: center; gap: 3px; padding: 10px 0 16px; font-size: 11.5px; font-weight: 600; }
.ph-selbar a.danger { color: var(--k-suo-deep); }
.ph-selhead { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; background: var(--k-ink); color: var(--k-lift); flex: none; }
.ph-selhead b { font-size: 16px; }

  return `<span class="bl"><svg viewBox="0 0 100 100" aria-hidden="true"><defs>${petals.map((p, i) => `<linearGradient id="${u}g${i}" x1="20" y1="12" x2="78" y2="90" gradientUnits="userSpaceOnUse"><stop stop-color="${p.a}"/><stop offset=".5" stop-color="${p.b}"/><stop offset="1" stop-color="${p.c}"/></linearGradient>`).join("")}</defs><g transform="rotate(${rot} 50 50)">${petals.map((p, i) => `<path d="${d}" transform="rotate(${p.r} 50 50) translate(50 50) scale(${p.s}) translate(-50 -50)" fill="url(#${u}g${i})" opacity="${p.o}"/>`).join("")}${petals.map((p) => `<path class="app-bloom-vein" d="M50 41 C49 29 49 18 50 8" transform="rotate(${p.r} 50 50)"/>`).join("")}</g><circle class="app-bloom-centre-shadow" cx="50" cy="50" r="23" style="fill:var(--k-plum)"/><circle class="app-bloom-centre" cx="50" cy="50" r="20" style="fill:var(--k-plum)"/><g fill="none" stroke="var(--k-lift)" color="var(--k-lift)" stroke-width="4.5">${GLYPH[app.glyph]}</g></svg></span>`;
}

/* How each app reaches the phone decides its one action:
   native → its own app (TestFlight on iPhone, an APK on Android)
   store  → an app from the App Store / Play Store pointed at Kimono
   inside → a screen of this app
   web    → a website, added to the Home Screen with its bloom as the icon */
const APPS = [
  { id: "kimono-photos", name: "Photos", accent: "#b5653a", glyph: "image", how: "native", have: true, about: "Every photo from every phone" },
  { id: "kimono-drive", name: "Drive", accent: "#5f5596", glyph: "file", how: "inside", have: true, about: "Spaces and files you share" },
  { id: "kimono-notes", name: "Notes", accent: "#3f6a8a", glyph: "notes", how: "web", have: false, about: "The household wiki" },
  { id: "kimono-vpn", name: "VPN", accent: "#2f6b7a", glyph: "mesh", how: "store", have: true, about: "Reach your devices from anywhere", on: true },
  { id: "kimono-films", name: "Films", accent: "#7b4f8f", glyph: "play", how: "native", have: false, about: "Films and shows from the shelf" },
];
const status = (a) => a.have ? (a.on ? "Connected" : "Open") : "Get";

const phone = (inner, cls = "") => `<div class="mk-screen mk-phone"><div class="dv ac ph ${cls}" style="display:flex;flex-direction:column;height:100%"><div class="ph-status"><b>9:41</b><i></i></div>${inner}</div></div>`;
const tabs = (cur = "home") => `<nav class="ph-tabs three">${[["home", "Home", "home"], ["drive", "Drive", "folder"], ["you", "You", ""]].map(([id, l, i]) => `<a href="#" ${id === cur ? 'aria-current="page"' : ""}>${id === "you" ? pfp("akram", 22) : I(i)}${l}</a>`).join("")}</nav>`;
const phHead = (end = "") => `<div class="ph-head">${kmark()}<span class="end">${end}</span></div>`;
const hello = `<div class="ph-hello"><p>Your household</p><h1>Welcome home, <strong>Akram.</strong></h1></div>`;

/* ═══════════════════════ A — 絵馬 Ema ═══════════════════════ */
function ema(a) {
  return `<a class="launcher-app" href="#"><span class="app-cord" aria-hidden="true"><i></i><i></i><b></b></span><span class="app-ema"><span class="ema-grain"></span><span class="launcher-icon">${bloomOf(a)}</span><span class="ema-copy"><span class="launcher-name">${a.name}</span><span class="launcher-status ${a.have ? "" : "get"}">${status(a)} <span aria-hidden="true">${a.have ? "→" : "↓"}</span></span></span></span><span class="ema-tassel" aria-hidden="true"><i></i><i></i><i></i></span></a>`;
}
function versionA() {
  const rails = [APPS.slice(0, 2), APPS.slice(2, 4), APPS.slice(4)].map((pair) => `<div class="launcher-grid">${pair.map(ema).join("")}</div>`).join("");
  const a1 = phone(phHead(`<button class="dv-iconbtn" aria-label="Search">${I("search")}</button>`) + `<div class="ph-scroll">${hello}<section class="launcher-section"><h2>Applications</h2>${rails}</section></div>` + tabs());
  const a2 = phone(phHead() + `<div class="ph-scroll"><section class="launcher-section" style="padding-top:8px"><h2>Applications</h2>${rails}</section></div>` + tabs(), "");
  return `<header><h2>A · 絵馬 Ema</h2><p>The Portal's home, carried over as it is. Each app hangs as an ema plaque, two to a rail. An app you don't have yet says <b>Get ↓</b> where the others say Open. It's the most Kimono of the three, and the slowest to scan once there are many apps.</p></header>
  ${frame("A1", "Home", "The greeting from the website, then the plaques. Tapping Get opens the sheet for that app (see Shared).", `<div class="mk-phones">${a1}${a2}</div>`, "The right phone is the same screen scrolled: the greeting scrolls away and the rails stay.")}`;
}

/* ═══════════════════════ B — 帳 Ledger ═══════════════════════ */
function row(a) {
  const end = a.have ? (a.on ? `<span class="br-state">Connected</span>` : seal("Open", "quiet")) : seal("Get");
  return `<div class="br-row">${bloomOf(a)}<span><b>${a.name}</b><small>${a.about}</small></span>${end}</div>`;
}
function versionB() {
  const b1 = phone(phHead(`<button class="dv-iconbtn" aria-label="Search">${I("search")}</button>`) + `<div class="ph-scroll">${hello}<div class="br-group">On this phone</div><div class="br-list">${APPS.filter((a) => a.have).map(row).join("")}</div><div class="br-group">Get them too</div><div class="br-list">${APPS.filter((a) => !a.have).map(row).join("")}</div></div>` + tabs());
  return `<header><h2>B · 帳 Ledger</h2><p>Each app is a row with its bloom, one line about it, and one action on the right. What you already have comes first; what you don't is gathered underneath, so setting up a new phone is one list from top to bottom. The quickest to scan, and the plainest.</p></header>
  ${frame("B1", "Home", "Open on the right of the apps you have, Get on the ones you don't. VPN shows whether it's connected instead of an Open button.", `<div class="mk-phones">${b1}</div>`)}`;
}

/* ═══════════════════════ C — 庭 Garden ═══════════════════════ */
function bed(a) { return `<a class="gc-app ${a.have ? "" : "faded"}" href="#">${bloomOf(a)}<b>${a.name}</b><small class="${a.have ? "" : "get"}">${a.have ? (a.on ? "Connected" : "") : "Get"}</small></a>`; }
function versionC() {
  const cuts = `<div class="gc-cuts"><span class="gc-cut on">${bloomOf(APPS[3])}VPN on</span><span class="gc-cut">${bloomOf(APPS[0])}Back up photos</span><span class="gc-cut">${bloomOf(APPS[1])}Upload</span></div>`;
  const c1 = phone(phHead(`<button class="dv-iconbtn" aria-label="Search">${I("search")}</button>`) + `<div class="ph-scroll">${hello}${cuts}<div class="gc-head"><h2>Applications</h2><a href="#">Edit</a></div><div class="gc-bed">${APPS.map(bed).join("")}</div></div>` + tabs());
  const c2 = phone(phHead() + `<div class="ph-scroll">${hello}${cuts}<div class="gc-head"><h2>Applications</h2></div><div class="gc-bed">${APPS.map(bed).join("")}</div>
    <div class="lp"></div><div class="lp-pick" style="left:264px;top:350px">${bloomOf(APPS[2]).replace('class="bl"', 'class="bl" style="width:84px;height:84px"')}</div>
    <div class="lp-menu" style="left:134px;top:446px"><a href="#">Open${I("open")}</a><a href="#">Add to Home Screen${I("plus")}</a><a href="#">Open in browser${I("link")}</a><a href="#" class="danger">Hide from Home${I("close")}</a></div></div>` + tabs());
  return `<header><h2>C · 庭 Garden</h2><p>Blooms in a bed, three across, like a phone's own home screen. Above them, a row of shortcuts into the apps for the things people do most. Apps you don't have yet are faded until you get them. Long-press any bloom for its menu.</p></header>
  ${frame("C1", "Home", "Shortcuts first, then every app. Edit lets you reorder or hide them.", `<div class="mk-phones">${c1}${c2}</div>`, "The right phone shows a long-press on Notes.")}`;
}

/* ═══════════════════════ Shared ═══════════════════════ */
function shared() {
  const s1 = phone(`<div class="si">${BRANCH}<h1>Kimono</h1><p>Sign in with your Kimono account.</p><label class="k-field"><span>Your Kimono's address</span><input value="kimono.example"></label>${seal("Continue")}</div><div class="si-foot">Only the people on your Kimono can sign in.</div>`);
  const s2 = phone(`<div class="web"><div class="web-bar"><button class="dv-iconbtn" aria-label="Cancel">${I("close")}</button><b>Sign in</b><span>auth.kimono…</span></div><div><div class="web-card"><h2>Welcome to Kimono</h2><label class="k-field"><span>Username or email</span><input value="akram"></label>${seal("Log in")}</div></div></div>`);
  const sheet = (inner, under = APPS) => phone(phHead() + `<div class="ph-scroll">${hello}<div class="br-list" style="margin-top:14px">${under.map(row).join("")}</div><div class="ph-scrim"></div><div class="ph-sheet"><div class="grab"></div><div class="pad">${inner}</div></div></div>` + tabs());
  const app = (a, line) => `<div class="sh-app">${bloomOf(a)}<div><h2>${a.name}</h2><small>${line}</small></div></div>`;
  const s3 = sheet(`${app(APPS[4], "An app of its own, for iPhone and iPad")}<div class="sh-steps"><div class="done"><b>✓</b>You're invited</div><div class="now"><b>2</b>Install it from TestFlight</div><div><b>3</b>Open it here</div></div>${seal("Open TestFlight")}`);
  const s4 = sheet(`${app(APPS[4], "An app of its own, for Android")}<div class="sh-bar"><i></i></div><div class="sh-meta"><span>Downloading</span><span>41 of 64 MB</span></div><div style="margin-top:16px">${seal("Cancel", "quiet")}</div>`);
  const s5 = sheet(`${app(APPS[2], "Opens like an app, from your Home Screen")}<div class="sh-home"><span class="sh-tile">${bloomOf(APPS[2])}</span>Notes</div><div class="sh-pair" style="margin-top:12px">${seal("Open here", "quiet")}${seal("Add to Home Screen")}</div>`);
  const s6 = phone(phHead() + `<div class="ph-scroll">${hello}<div class="br-list" style="margin-top:14px">${APPS.map(row).join("")}</div><div class="ph-scrim"></div><div class="sys"><h4>Install Kimono Films?</h4><p>This app comes from Kimono.</p><div class="row"><span>Cancel</span><span>Install</span></div></div></div>` + tabs());
  const s7 = sheet(`${app(APPS[3], "Uses the Tailscale app, signed in to Kimono")}<div class="sh-steps"><div class="done"><b>✓</b>Get Tailscale from the App Store</div><div class="now"><b>2</b>Sign in to Kimono in Tailscale</div><div><b>3</b>Turn it on</div></div>${seal("Open Tailscale")}`);
  return `<header><h2>Shared by all three</h2><p>Signing in, and getting an app you don't have yet. These work the same whichever home screen wins. Each kind of app gets one sheet, with its own steps.</p></header>
  ${frame("S1", "First launch", "The address once, then Kimono's own sign-in page in a sheet over the app. It's the page you already restyled; nothing else is asked.", `<div class="mk-phones">${s1}${s2}</div>`)}
  ${frame("S2", "Get an app that has its own app", "On iPhone the steps follow the TestFlight invite. On Android, Kimono downloads it and asks Android to install it.", `<div class="mk-phones">${s3}${s4}${s6}</div>`, "Android asks once to allow installs from Kimono; after that each app is one tap. Updates arrive the same way.")}
  ${frame("S3", "Get a website as an app", "A website app gets its bloom as the Home Screen icon and opens full-screen, with no browser bar.", `<div class="mk-phones">${s5}</div>`, "iPhone installs it as a small profile from Settings: two taps, once per app. Android adds it straight to the Home Screen.")}
  ${frame("S4", "Get an app from the store", "For apps Kimono doesn't make, like the VPN, the sheet opens the store app and then helps you sign in.", `<div class="mk-phones">${s7}</div>`)}`;
}

const VERSIONS = [
  { id: "a", jp: "絵馬", name: "A · Ema", sub: "The Portal's plaques", render: versionA },
  { id: "b", jp: "帳", name: "B · Ledger", sub: "One row per app", render: versionB },
  { id: "c", jp: "庭", name: "C · Garden", sub: "Shortcuts and blooms", render: versionC },
  { id: "shared", jp: "共", name: "Shared", sub: "Sign-in and getting apps", render: shared },
];
const tabsEl = document.getElementById("tabs"), secs = document.getElementById("sections");
VERSIONS.forEach((v, i) => {
  tabsEl.insertAdjacentHTML("beforeend", `<button class="mk-tab" role="tab" aria-selected="${i === 0}" data-v="${v.id}"><b><span class="jp">${v.jp}</span>${v.name}</b><small>${v.sub}</small></button>`);
  secs.insertAdjacentHTML("beforeend", `<section class="mk-section ${i === 0 ? "on" : ""}" id="v-${v.id}" role="tabpanel">${v.render()}</section>`);
});
function show(id) {
  document.querySelectorAll(".mk-tab").forEach((t) => t.setAttribute("aria-selected", t.dataset.v === id));
  document.querySelectorAll(".mk-section").forEach((s) => s.classList.toggle("on", s.id === "v-" + id));
}
tabsEl.addEventListener("click", (e) => { const b = e.target.closest(".mk-tab"); if (b) { show(b.dataset.v); window.scrollTo({ top: 0 }); } });
if (VERSIONS.some((v) => v.id === location.hash.slice(1))) show(location.hash.slice(1));
const solo = new URLSearchParams(location.search).get("frame");
if (solo) { const f = document.getElementById("f-" + solo); document.body.innerHTML = ""; document.body.style.padding = "24px"; document.body.appendChild(f); }
</script>
