# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Kimono Portal
  labels:
    blueprints.goauthentik.io/description: Kimono Portal OIDC provider and application
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true

  # Where a TV's code is entered (the Portal's /tv sends people here). It has
  # no stages of its own: Authentik adds the code entry, then runs the app's
  # consent, so the person sees what they're signing in before it does.
  - id: kimono-device-code-flow
    model: authentik_flows.flow
    state: present
    identifiers:
      slug: kimono-device-code
    attrs:
      name: Kimono - Sign in a TV
      title: Sign in on your TV
      designation: stage_configuration
      authentication: require_authenticated

  - id: kimono-local-brand
    model: authentik_brands.brand
    state: present
    identifiers:
      domain: localhost
    attrs:
      default: false
      branding_title: Kimono
      branding_logo: http://localhost:3000/brand/kimono-logo.svg
      branding_favicon: http://localhost:3000/brand/favicon-48.png
      branding_default_flow_background: http://localhost:3000/brand/kimono-login-background.svg
      branding_custom_css: !File /blueprints/kimono/kimono.css
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      flow_unenrollment: !Find [authentik_flows.flow, [slug, default-unenrollment-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      flow_device_code: !KeyOf kimono-device-code-flow
      attributes:
        settings:
          locale: en
          theme:
            base: light

  - id: kimono-portal-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Headscale (and every other RS256 client) verifies the ID token against
      # this provider's JWKS. Without a signing key Authentik falls back to
      # HS256 with the client secret and publishes no keys, so the sign-in dies
      # at the callback with an ID token it cannot verify.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_id: !Env KIMONO_PORTAL_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_PORTAL_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      # Auth.js discovers metadata from this provider-specific URL and requires
      # the returned issuer to match it exactly.
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: http://localhost:3000/api/auth/callback/authentik
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-portal
    attrs:
      name: Kimono Portal
      provider: !KeyOf kimono-portal-provider
      meta_description: Your household, thoughtfully connected.
      meta_launch_url: http://localhost:3000/login/switch
      open_in_new_tab: true
