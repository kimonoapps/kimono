name: kimono-server

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    volumes:
      - authentik_database:/var/lib/postgresql/data

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    command: server
    restart: unless-stopped
    environment: &authentik_environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Authentik secret key required}
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN:?Authentik domain required}
      KIMONO_HEADSCALE_OIDC_CLIENT_ID: ${KIMONO_HEADSCALE_OIDC_CLIENT_ID:-kimono-headscale}
      KIMONO_HEADSCALE_OIDC_CLIENT_SECRET: ${KIMONO_HEADSCALE_OIDC_CLIENT_SECRET:?Headscale OIDC client secret required}
      KIMONO_HEADSCALE_OIDC_REDIRECT_URI: ${KIMONO_HEADSCALE_OIDC_REDIRECT_URI:?Headscale OIDC redirect URI required}
      KIMONO_PORTAL_DOMAIN: ${KIMONO_PORTAL_DOMAIN:?Portal domain required}
      KIMONO_PORTAL_URL: https://${KIMONO_PORTAL_DOMAIN}
      KIMONO_PORTAL_OIDC_CLIENT_ID: ${KIMONO_PORTAL_OIDC_CLIENT_ID:-kimono-portal}
      KIMONO_PORTAL_OIDC_CLIENT_SECRET: ${KIMONO_PORTAL_OIDC_CLIENT_SECRET:?Portal OIDC secret required}
      KIMONO_PORTAL_OIDC_REDIRECT_URI: ${KIMONO_PORTAL_OIDC_REDIRECT_URI:?Portal OIDC redirect required}
      KIMONO_PORTAL_API_TOKEN: ${KIMONO_PORTAL_API_TOKEN:?Portal directory token required}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    shm_size: 512mb
    volumes:
      - authentik_data:/data
      - ./authentik/custom-templates:/templates:ro

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    command: worker
    restart: unless-stopped
    user: root
    environment: *authentik_environment
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 5
    shm_size: 512mb
    volumes:
      - authentik_data:/data
      - ./authentik/blueprints:/blueprints/kimono:ro
      - ./authentik/certs:/certs
      - ./authentik/custom-templates:/templates:ro

  headscale-config:
    image: docker.io/library/alpine:3.22
    restart: "no"
    environment:
      HEADSCALE_NODE_EXPIRY: ${HEADSCALE_NODE_EXPIRY:-180d}
      KIMONO_HEADSCALE_OIDC_CLIENT_ID: ${KIMONO_HEADSCALE_OIDC_CLIENT_ID:-kimono-headscale}
      KIMONO_HEADSCALE_OIDC_ISSUER: ${KIMONO_HEADSCALE_OIDC_ISSUER:?Headscale OIDC issuer required}
      MAGIC_DNS_DOMAIN: ${MAGIC_DNS_DOMAIN:?MagicDNS domain required}
      MESH_DOMAIN: ${MESH_DOMAIN:?mesh domain required}
    command: ["/bin/sh", "/opt/kimono/render-headscale-config.sh"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./headscale/config.yaml.tmpl:/opt/kimono/config.yaml.tmpl:ro
      - ./headscale/policy.hujson:/opt/kimono/policy.hujson:ro
      - ./scripts/render-headscale-config.sh:/opt/kimono/render-headscale-config.sh:ro
      - headscale_config:/output

  headscale:
    image: docker.io/headscale/headscale:${HEADSCALE_TAG:-0.28.0}
    command: serve
    restart: unless-stopped
    read_only: true
    environment:
      HEADSCALE_CONFIG: /etc/headscale/config.yaml
      HEADSCALE_OIDC_CLIENT_SECRET: ${KIMONO_HEADSCALE_OIDC_CLIENT_SECRET:?Headscale OIDC client secret required}
    depends_on:
      authentik-server:
        condition: service_healthy
      headscale-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "headscale", "health"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run/headscale
    ports:
      - "3478:3478/udp"
    volumes:
      - headscale_config:/etc/headscale:ro
      - headscale_data:/var/lib/headscale

  portal-config:
    image: docker.io/library/alpine:3.22
    command: ["chown", "-R", "1000:1000", "/config"]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${KIMONO_PORTAL_STATE_PATH:-/var/lib/kimono-portal}:/config

  portal:
    image: ghcr.io/kimonoapps/kimono-portal:${KIMONO_PORTAL_TAG:-latest}
    restart: unless-stopped
    environment:
      AUTHENTIK_ISSUER: https://${AUTHENTIK_DOMAIN}/application/o/kimono-portal/
      AUTHENTIK_CLIENT_ID: ${KIMONO_PORTAL_OIDC_CLIENT_ID:-kimono-portal}
      AUTHENTIK_CLIENT_SECRET: ${KIMONO_PORTAL_OIDC_CLIENT_SECRET:?Portal OIDC secret required}
      AUTH_SECRET: ${KIMONO_PORTAL_SESSION_SECRET:?Portal session secret required}
      # Pin the public origin: behind the proxy the container would otherwise
      # derive sign-in redirects from its own bind address.
      AUTH_URL: https://${KIMONO_PORTAL_DOMAIN}/api/auth
      KIMONO_PORTAL_URL: https://${KIMONO_PORTAL_DOMAIN}
      AUTH_TRUST_HOST: "true"
      KIMONO_BASE_DOMAIN: ${KIMONO_BASE_DOMAIN:?base domain required}
      KIMONO_IDENTITY_DOMAIN: ${AUTHENTIK_DOMAIN:?Authentik domain required}
      KIMONO_IDENTITY_API_URL: ${KIMONO_IDENTITY_API_URL:-http://authentik-server:9000}
      KIMONO_IDENTITY_API_TOKEN: ${KIMONO_PORTAL_API_TOKEN:?Portal directory token required}
      KIMONO_MESH_DOMAIN: ${MESH_DOMAIN:?mesh domain required}
      KIMONO_MESH_API_URL: ${KIMONO_MESH_API_URL:-http://headscale:8080}
      KIMONO_MESH_API_KEY: ${KIMONO_MESH_API_KEY:-}
      KIMONO_WATCH_NZBDAV_KEY: ${NZBDAV_API_KEY:?nzbdav API key required}
      KIMONO_WATCH_NZBDAV_WEBDAV_PASSWORD: ${NZBDAV_WEBDAV_PASSWORD:?nzbdav WebDAV password required}
      KIMONO_WATCH_PACKAGER_KEY: ${WATCH_PACKAGER_KEY:?Watch packager key required}
      KIMONO_BOOKS_KEY: ${BOOKS_KEY:?Books key required}
    depends_on:
      authentik-server:
        condition: service_healthy
      portal-config:
        condition: service_completed_successfully
    volumes:
      - ${KIMONO_PORTAL_STATE_PATH:-/var/lib/kimono-portal}:/var/lib/kimono-portal
      - ${KIMONO_APP_DEFINITIONS_PATH:-./app-definitions}:/etc/kimono/app-definitions:ro

  reconciler:
    image: ghcr.io/kimonoapps/kimono-reconciler:${KIMONO_RECONCILER_TAG:-latest}
    restart: unless-stopped
    environment:
      KIMONO_PORTAL_STATE_DIR: /var/lib/kimono-portal
      KIMONO_BLUEPRINT_DIR: /blueprints/kimono
      KIMONO_BACKUP_HELPER_IMAGE: ghcr.io/kimonoapps/kimono-reconciler:${KIMONO_RECONCILER_TAG:-latest}
    depends_on:
      portal-config:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    volumes:
      # The engine resolves generated bind mounts against the host, so the state
      # directories must appear at identical paths inside this container.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KIMONO_PORTAL_STATE_PATH:-/var/lib/kimono-portal}:/var/lib/kimono-portal
      - ${KIMONO_STATE_PATH:-/var/lib/kimono}:/var/lib/kimono
      - ./authentik/blueprints:/blueprints/kimono
      - ${KIMONO_APP_DEFINITIONS_PATH:-./app-definitions}:/etc/kimono/app-definitions:ro

  caddy:
    image: docker.io/library/caddy:${CADDY_TAG:-2.10.2-alpine}
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME email required}
      AUTHENTIK_DOMAIN: ${AUTHENTIK_DOMAIN:?Authentik domain required}
      MESH_DOMAIN: ${MESH_DOMAIN:?mesh domain required}
      KIMONO_PORTAL_DOMAIN: ${KIMONO_PORTAL_DOMAIN:?portal domain required}
    # Not gated on Authentik: Caddy answers from the first second of a boot
    # with the starting page, rather than refusing connections for minutes.
    depends_on:
      authentik-server:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        # Fixed, so Headscale can trust forwarded client addresses from Caddy
        # alone (headscale/config.yaml.tmpl) rather than from any container.
        # Outside the network's ip_range, so nothing else is handed it.
        ipv4_address: 10.89.1.2
      # The names Caddy answers by here are the ones the reconciler gives it on
      # each published app's own network (cli/internal/reconcile/proxy.go), so
      # apps reach sign-in and the Portal through Caddy rather than out over
      # the internet, which an app's network doesn't carry.
      kimono-edge:
        aliases:
          - ${AUTHENTIK_DOMAIN}
          - ${KIMONO_PORTAL_DOMAIN}
      # The tunnel connectors' way out, and the only place Caddy believes a
      # forwarded client address from.
      kimono-tunnel:
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Site files the Portal generates for directly published hostnames.
      - ${KIMONO_STATE_PATH:-/var/lib/kimono}/apps/generated:/etc/caddy/sites:ro
      # One directory rather than a mount per file, so a new brand asset is
      # available to Authentik without editing Compose.
      - ${KIMONO_BRAND_ASSET_PATH:-../../../apps/portal/public/brand}:/srv/kimono-brand:ro
      - caddy_data:/data
      - caddy_config:/config

  # Kimono Watch's stream search (AIOStreams) and Usenet streaming (nzbdav).
  # Nobody configures either by hand: the Portal sets both up from the
  # accounts entered under Admin → Applications → Watch, and is the only thing
  # that talks to them. Neither is published.
  aiostreams:
    image: ghcr.io/viren070/aiostreams:${AIOSTREAMS_TAG:-latest}
    restart: unless-stopped
    environment:
      SECRET_KEY: ${AIOSTREAMS_SECRET_KEY:?AIOStreams secret key required}
      BASE_URL: http://aiostreams:3000
      # The Portal is its only caller, so every search shares one address:
      # the per-address limit (10 searches in 15 s) turned away Home's checks
      # and play alike, and a turned-away search read as "no copy".
      DISABLE_RATE_LIMITS: "true"
    security_opt:
      - no-new-privileges:true
    volumes:
      - aiostreams_data:/app/data

  nzbdav:
    image: docker.io/nzbdav/nzbdav:${NZBDAV_TAG:-latest}
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      # Fixed here so the Portal and nzbdav agree without being told.
      FRONTEND_BACKEND_API_KEY: ${NZBDAV_API_KEY:?nzbdav API key required}
      WEBDAV_USER: kimono
      WEBDAV_PASSWORD: ${NZBDAV_WEBDAV_PASSWORD:?nzbdav WebDAV password required}
    security_opt:
      - no-new-privileges:true
    volumes:
      - nzbdav_config:/config

  # Kimono Watch's HLS packager: turns streams into HLS for browsers, AirPlay
  # and Chromecast, reading them through the Portal's own relay. It finds the
  # GPU itself (NVIDIA through the nvidia runtime when the server has one,
  # Intel and AMD through /dev/dri) and falls back to software.
  watch-packager:
    image: ghcr.io/kimonoapps/kimono-watch-packager:${KIMONO_WATCH_PACKAGER_TAG:-latest}
    restart: unless-stopped
    runtime: ${WATCH_PACKAGER_RUNTIME:-runc}
    environment:
      KIMONO_PACKAGER_KEY: ${WATCH_PACKAGER_KEY:?Watch packager key required}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    # GPUs are character devices 226:*; bound in when present, allowed either way.
    device_cgroup_rules:
      - "c 226:* rmw"
    security_opt:
      - no-new-privileges:true
    volumes:
      # Created empty on a server without a GPU, so the service still starts.
      - type: bind
        source: /dev/dri
        target: /dev/dri
        bind:
          create_host_path: true
      - watch_packager_cache:/var/cache/kimono-packager

  # Kimono Books' catalog: the public book metadata dumps, kept compressed and
  # loaded into a Postgres of its own. Off unless the server's environment
  # names the profile (COMPOSE_PROFILES=books): it takes about 150 GB with
  # Open Library alone, and Anna's Archive collections add more.
  books-db:
    image: docker.io/library/postgres:17-alpine
    profiles: [books]
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: books
      POSTGRES_PASSWORD: ${BOOKS_DB_PASS:?Books database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d books -U books"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 5
    shm_size: 1g
    security_opt:
      - no-new-privileges:true
    volumes:
      - books_database:/var/lib/postgresql/data

  # Fetches the dumps (Anna's Archive's torrents through Watch's Real-Debrid
  # account, read from the Portal), loads them, and answers search and ISBN
  # lookups on :8080 for the Portal.
  books-indexer:
    image: ghcr.io/kimonoapps/kimono-books-indexer:${KIMONO_BOOKS_INDEXER_TAG:-latest}
    profiles: [books]
    restart: unless-stopped
    environment:
      KIMONO_BOOKS_DATABASE_URL: postgres://books:${BOOKS_DB_PASS}@books-db:5432/books
      KIMONO_BOOKS_KEY: ${BOOKS_KEY:?Books key required}
      KIMONO_PORTAL_URL: http://portal:3000
      KIMONO_BOOKS_AA_TORRENTS_URL: ${BOOKS_AA_TORRENTS_URL:-}
      KIMONO_BOOKS_AA_GROUPS: ${BOOKS_AA_GROUPS:-}
      # Live lookups when the catalog has nothing (or nothing fresh) for a
      # book. Open Library always; the rest only when set. The Anna's Archive
      # cookie is a member's session, for metadata pages without bot checks.
      KIMONO_BOOKS_GOOGLE_KEY: ${BOOKS_GOOGLE_KEY:-}
      KIMONO_BOOKS_HARDCOVER_TOKEN: ${BOOKS_HARDCOVER_TOKEN:-}
      KIMONO_BOOKS_AA_BASE: ${BOOKS_AA_BASE:-}
      KIMONO_BOOKS_AA_COOKIE: ${BOOKS_AA_COOKIE:-}
      KIMONO_BOOKS_AA_RECORD_PATH: ${BOOKS_AA_RECORD_PATH:-}
      # "off" skips the monthly Open Library dump (~150 GB): the catalog then
      # grows only from what people look up.
      KIMONO_BOOKS_OPENLIBRARY_DUMP: ${BOOKS_OPENLIBRARY_DUMP:-on}
    depends_on:
      books-db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    volumes:
      - books_dumps:/var/lib/kimono-books

# Both subnets are fixed so the proxies' trust can name them. Containers draw
# from the upper half (ip_range) only, which keeps the gateway (.1) and Caddy's
# fixed address out of the ranges the trust is given. `kimono server update`
# moves an older kimono-edge onto this subnet (server.go, migrateEdgeNetwork).
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.1.0/24
          ip_range: 10.89.1.128/25
          gateway: 10.89.1.1
  # Created here so the appliance's proxy can start before any app exists; the
  # generated apps project attaches to it by name rather than creating its own.
  # Internal, and no longer where apps meet the proxy: each published app has
  # a network of its own with Caddy and its connectors, and an app still
  # attached here from before is moved off by the next apply.
  kimono-edge:
    name: kimono-edge
    internal: true
    ipam:
      config:
        - subnet: 10.89.0.0/24
          ip_range: 10.89.0.128/25
          gateway: 10.89.0.1
  # The tunnel connectors' own network, with Caddy and the internet: apps are
  # never on it, so none can pose as a connector.
  kimono-tunnel:
    name: kimono-tunnel
    ipam:
      config:
        - subnet: 10.89.2.0/24
          ip_range: 10.89.2.128/25
          gateway: 10.89.2.1

volumes:
  aiostreams_data:
  books_database:
  books_dumps:
  nzbdav_config:
  watch_packager_cache:
  authentik_database:
  authentik_data:
  caddy_config:
  caddy_data:
  headscale_config:
  headscale_data:
