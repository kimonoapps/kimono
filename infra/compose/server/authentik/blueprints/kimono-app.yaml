# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Kimono app
  labels:
    blueprints.goauthentik.io/description: Sign-in for the Kimono phone app
    blueprints.goauthentik.io/instantiate: "true"

# The phone app signs in like any other Kimono app, through the same page, but
# it cannot keep a secret: anything shipped inside an app can be read out of
# it. So it is a public client, and PKCE proves the app that started a sign-in
# is the one finishing it. It lives in its own blueprint so a problem here can
# never stop the Portal's or the mesh's sign-in from applying.
entries:
  - id: kimono-app-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono app
    attrs:
      # Explicit consent: any app on the phone can claim kimono://, and with
      # implicit consent one that started its own sign-in would be handed a
      # code without the person seeing anything.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: public
      client_id: kimono-app
      # The device code grant is for Kimono on devices with no browser, such as
      # the Silkscreen e-reader: it shows a short code, and the person approves
      # it from their phone at /device, through the same consent page.
      grant_types: [authorization_code, refresh_token, "urn:ietf:params:oauth:grant-type:device_code"]
      # The Portal checks the app's access tokens against this provider's keys.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Short access, long refresh: a lost phone stops working within minutes
      # of being signed out, and a kept one doesn't ask for a password monthly.
      access_token_validity: minutes=10
      # Also how long a device's sign-in code lasts: long enough to find the
      # phone and type it. Authentik's default of a minute is not.
      access_code_validity: minutes=5
      refresh_token_validity: days=30
      # A new refresh token only in its last week. The app and its Files
      # extension renew from the same kept token, often at the same moment;
      # rotating every time left one of them holding a revoked token, which
      # signed the phone out.
      refresh_token_threshold: days=7
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
      redirect_uris:
        - url: kimono://auth
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-app
    attrs:
      name: Kimono app
      provider: !KeyOf kimono-app-provider
      # Not something to open from a browser, so it stays off the app list.
      meta_launch_url: blank://blank

  # Where a person types a device's code. Authentik serves it at /device, and
  # only once the brand names a flow for it. The flow itself is empty: Authentik
  # adds the code entry, then the provider's sign-in and consent above.
  - id: kimono-device-code-flow
    model: authentik_flows.flow
    state: present
    identifiers:
      slug: kimono-device-code
    attrs:
      name: Kimono device sign-in
      title: Sign in a device to Kimono
      designation: stage_configuration
      authentication: require_authenticated

  # Only this one field of the brand; the rest of it is set in kimono-headscale.yaml.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: !Env AUTHENTIK_DOMAIN
    attrs:
      flow_device_code: !KeyOf kimono-device-code-flow
