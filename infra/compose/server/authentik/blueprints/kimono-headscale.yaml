# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Kimono Platform
  labels:
    blueprints.goauthentik.io/description: Kimono identity brand and application OIDC providers
    blueprints.goauthentik.io/instantiate: "true"

entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true

  # The sign-in page greets with the flow's own title, not the brand title, so
  # the stock "Welcome to authentik!" survives branding unless it is set here.
  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: default-authentication-flow
    attrs:
      name: Default - Authentication flow
      designation: authentication
      title: Welcome to Kimono

  # The Portal lists accounts so an administrator can grant Kimono VPN to a real
  # person. It gets a service account that may read the directory and nothing
  # else — the Portal should never hold more privilege than the job needs.
  - id: kimono-portal-service
    model: authentik_core.user
    state: present
    identifiers:
      username: kimono-portal
    attrs:
      name: Kimono Portal
      type: service_account
      path: goauthentik.io/service-accounts

  - id: kimono-portal-role
    model: authentik_rbac.role
    state: present
    identifiers:
      name: Kimono Portal directory
    attrs:
      permissions:
        - authentik_core.view_user
        - authentik_core.change_user
        - authentik_core.view_group
        - authentik_core.change_group

  - model: authentik_core.group
    state: present
    identifiers:
      name: Kimono Portal
    attrs:
      users:
        - !KeyOf kimono-portal-service
      roles:
        - !KeyOf kimono-portal-role

  # Kimono VPN access is membership of this group, so the group is the record.
  # Keeping it in the identity provider means an account and its entitlements
  # cannot drift apart, and revoking the account revokes the mesh with it.
  - model: authentik_core.group
    state: present
    identifiers:
      name: kimono-vpn
    attrs:
      is_superuser: false

  - model: authentik_core.token
    state: present
    identifiers:
      identifier: kimono-portal-directory
    attrs:
      user: !KeyOf kimono-portal-service
      intent: api
      expiring: false
      description: Lets the Kimono Portal list accounts
      key: !Env KIMONO_PORTAL_API_TOKEN

  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: !Env AUTHENTIK_DOMAIN
    attrs:
      default: false
      branding_title: Kimono
      branding_logo: /static/kimono/kimono-logo.png
      branding_favicon: /static/kimono/favicon-48.png
      branding_default_flow_background: /static/kimono/kimono-login-background.svg
      branding_custom_css: !File /blueprints/kimono/kimono.css
      flow_authentication: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      flow_invalidation: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      flow_recovery: !Find [authentik_flows.flow, [slug, default-recovery-flow]]
      flow_unenrollment: !Find [authentik_flows.flow, [slug, default-unenrollment-flow]]
      flow_user_settings: !Find [authentik_flows.flow, [slug, default-user-settings-flow]]
      attributes:
        settings:
          locale: en
          theme:
            base: light

  - id: kimono-headscale-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Headscale
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Headscale (and every other RS256 client) verifies the ID token against
      # this provider's JWKS. Without a signing key Authentik falls back to
      # HS256 with the client secret and publishes no keys, so the sign-in dies
      # at the callback with an ID token it cannot verify.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_id: !Env KIMONO_HEADSCALE_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_HEADSCALE_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: !Env KIMONO_HEADSCALE_OIDC_REDIRECT_URI
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-headscale
    attrs:
      name: Kimono Mesh
      provider: !KeyOf kimono-headscale-provider
      meta_description: Private access to your Kimono devices.
      open_in_new_tab: true

  # Kimono Notes moved to a Portal-generated blueprint. Remove the objects this
  # blueprint used to own, application first so the provider is unreferenced.
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: kimono-notes

  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      client_id: kimono-notes

  - id: kimono-portal-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Kimono Portal
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Headscale (and every other RS256 client) verifies the ID token against
      # this provider's JWKS. Without a signing key Authentik falls back to
      # HS256 with the client secret and publishes no keys, so the sign-in dies
      # at the callback with an ID token it cannot verify.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      client_id: !Env KIMONO_PORTAL_OIDC_CLIENT_ID
      client_secret: !Env KIMONO_PORTAL_OIDC_CLIENT_SECRET
      grant_types: [authorization_code, refresh_token]
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_uuid
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - url: !Env KIMONO_PORTAL_OIDC_REDIRECT_URI
          matching_mode: strict
          redirect_uri_type: authorization

  - model: authentik_core.application
    state: present
    identifiers:
      slug: kimono-portal
    attrs:
      name: Kimono
      provider: !KeyOf kimono-portal-provider
      meta_description: Your household, thoughtfully connected.
      meta_launch_url: !Env KIMONO_PORTAL_URL
      open_in_new_tab: true
