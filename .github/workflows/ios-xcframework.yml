name: Shared.xcframework (and WatchShared) for xtool

# Kotlin/Native links Apple targets only on macOS, so a local xtool build of Kimono on Linux
# gets the Compose app from here: run this workflow, then
#   gh run download --repo kimonoapps/kimono -n Shared.xcframework -D /tmp/kimono-fw
# With app: watch (or both) it builds WatchShared.xcframework too, for a local xtool build of Kimono Watch:
#   gh run download --repo kimonoapps/kimono -n WatchShared.xcframework -D /tmp/kimono-watch-fw
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app's framework to build
        type: choice
        default: kimono
        options: [kimono, watch, both]
      runner:
        description: Hosted macOS runner (arm64 macos-latest often sits unacquired for lack of capacity)
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, macos-latest, macos-14]

permissions:
  contents: read

jobs:
  xcframework:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/compose/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build Shared.xcframework
        if: inputs.app != 'watch'
        working-directory: apps/compose
        run: |
          # Both release links run in the Gradle daemon; side by side they overran its 4 GB heap
          # (gradle.properties). One at a time, with most of the runner's 14 GB, they fit.
          ./gradlew --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -Dfile.encoding=UTF-8" :shared:assembleSharedReleaseXCFramework
          cd shared/build/XCFrameworks/release
          # Symlinks inside the framework survive only as a zip (-y), not as loose artifact files.
          zip -qry "$RUNNER_TEMP/Shared.xcframework.zip" Shared.xcframework
      - name: Build WatchShared.xcframework
        if: inputs.app == 'watch' || inputs.app == 'both'
        working-directory: apps/compose
        run: |
          ./gradlew --max-workers=1 -Dorg.gradle.jvmargs="-Xmx10g -Dfile.encoding=UTF-8" :watchShared:assembleWatchSharedReleaseXCFramework
          cd watchShared/build/XCFrameworks/release
          zip -qry "$RUNNER_TEMP/WatchShared.xcframework.zip" WatchShared.xcframework
      # Pin to a commit SHA, as the release workflow does for its actions.
      - uses: actions/upload-artifact@v4
        if: inputs.app != 'watch'
        with:
          name: Shared.xcframework
          path: ${{ runner.temp }}/Shared.xcframework.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.app == 'watch' || inputs.app == 'both'
        with:
          name: WatchShared.xcframework
          path: ${{ runner.temp }}/WatchShared.xcframework.zip
          retention-days: 14
