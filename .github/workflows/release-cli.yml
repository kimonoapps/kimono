name: Release Kimono CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static Linux binaries
        env:
          KIMONO_VERSION: ${{ github.ref_name }}
        run: scripts/build-cli.sh
      - name: Test
        run: go test ./...
      - name: Validate Headscale isolation policy
        run: docker run --rm -v "$PWD/infra/compose/server/headscale/policy.hujson:/policy.hujson:ro" docker.io/headscale/headscale:0.28.0 policy check --file /policy.hujson
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-running a partly failed release must not die here on a release that
        # already exists, or the later steps can never be retried.
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          else
            gh release create "${{ github.ref_name }}" --generate-notes dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          fi
      # Images live under the kimonoapps organisation, which GITHUB_TOKEN cannot
      # write to — its scope is this repository's owner. Publishing there needs
      # a personal access token with write:packages, stored as GHCR_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish Kimono Portal image
        run: |
          docker build -f Dockerfile.portal -t ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-portal:latest .
          docker push ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-portal:latest
      - name: Publish Kimono reconciler image
        run: |
          docker build -f Dockerfile.reconciler -t ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-reconciler:latest .
          docker push ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-reconciler:latest
