name: Release Kimono CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static Linux binaries
        env:
          KIMONO_VERSION: ${{ github.ref_name }}
        run: scripts/build-cli.sh
      - name: Test
        run: go test ./...
      - name: Validate Headscale isolation policy
        run: docker run --rm -v "$PWD/infra/compose/server/headscale/policy.hujson:/policy.hujson:ro" docker.io/headscale/headscale:0.28.0 policy check --file /policy.hujson
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-running a partly failed release must not die here on a release that
        # already exists, or the later steps can never be retried.
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          else
            gh release create "${{ github.ref_name }}" --generate-notes dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          fi
      # Images live under the kimonoapps organisation, which GITHUB_TOKEN cannot
      # write to — its scope is this repository's owner. Publishing there needs
      # a personal access token with write:packages, stored as GHCR_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish Kimono Portal image
        run: |
          docker build -f Dockerfile.portal --build-arg KIMONO_VERSION=${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-portal:latest .
          docker push ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-portal:latest
      - name: Publish Kimono reconciler image
        run: |
          docker build -f Dockerfile.reconciler -t ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-reconciler:latest .
          docker push ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-reconciler:latest

  # The Kimono app for Android, signed and attached to the release, numbered
  # from the tag so every release outranks the last (v0.7.3 → build 7003).
  # Portals offer the one matching their own version. A separate job, so a
  # problem here never holds up the CLI or the images; it skips itself when
  # the signing key isn't set.
  android:
    needs: release
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.KIMONO_ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KIMONO_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check for the signing key
        id: key
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Android signing key in this repository's secrets; skipping the APK."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the signed APK
        if: steps.key.outputs.present == 'true'
        working-directory: apps/compose
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          mkdir -p ~/.config/kimono
          printf '%s' "$KEYSTORE" | base64 -d > ~/.config/kimono/android-release.jks
          printf '%s' "$KEYSTORE_PASSWORD" > ~/.config/kimono/android-release.password
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon :androidApp:assembleRelease -PkimonoBuild="$BUILD" -PkimonoVersion="$VERSION"
          rm -f ~/.config/kimono/android-release.jks ~/.config/kimono/android-release.password
          APK="kimono-$VERSION.apk"
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "$APK"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -q "CN=Kimono"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          printf '{"version":"%s","build":%s,"file":"%s","size":%s,"sha256":"%s"}\n' "$VERSION" "$BUILD" "$APK" "$SIZE" "$SHA" > kimono-android.json
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Attach it to the release
        if: steps.key.outputs.present == 'true'
        working-directory: apps/compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber "$APK" kimono-android.json

  # The Kimono app for iPhone, built and sent to TestFlight, numbered from
  # the tag like the Android one (v0.7.3 is 0.7.3, build 7003). Signing is
  # automatic through an App Store Connect API key; internal testers get each
  # build as soon as Apple has processed it. Skips itself without the key.
  ios:
    needs: release
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check for the App Store Connect key
        id: key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] && [ -n "$APPLE_TEAM_ID" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No App Store Connect key in this repository's secrets; skipping the iPhone build."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and send to TestFlight
        if: steps.key.outputs.present == 'true'
        working-directory: apps/compose/iosApp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          # The newest Xcode on the runner.
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
          xcodegen
          KEY="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Kimono.xcodeproj -scheme Kimono -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kimono.xcarchive" archive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kimono.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          echo "Kimono $VERSION ($BUILD) is on its way to TestFlight."
