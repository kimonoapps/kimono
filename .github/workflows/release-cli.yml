name: Release Kimono CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static Linux binaries
        env:
          KIMONO_VERSION: ${{ github.ref_name }}
        run: scripts/build-cli.sh
      - name: Test
        run: go test ./...
      - name: Validate Headscale isolation policy
        run: docker run --rm -v "$PWD/infra/compose/server/headscale/policy.hujson:/policy.hujson:ro" docker.io/headscale/headscale:0.28.0 policy check --file /policy.hujson
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-running a partly failed release must not die here on a release that
        # already exists, or the later steps can never be retried.
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" --clobber dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          else
            gh release create "${{ github.ref_name }}" --generate-notes dist/kimono_linux_amd64 dist/kimono_linux_arm64 dist/SHA256SUMS
          fi
      # Images live under the kimonoapps organisation, which GITHUB_TOKEN cannot
      # write to — its scope is this repository's owner. Publishing there needs
      # a personal access token with write:packages, stored as GHCR_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Publish Kimono Portal image
        run: |
          docker build -f Dockerfile.portal --build-arg KIMONO_VERSION=${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-portal:latest .
          docker push ghcr.io/kimonoapps/kimono-portal:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-portal:latest
      - name: Publish Kimono reconciler image
        run: |
          docker build -f Dockerfile.reconciler -t ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }} -t ghcr.io/kimonoapps/kimono-reconciler:latest .
          docker push ghcr.io/kimonoapps/kimono-reconciler:${{ github.ref_name }}
          docker push ghcr.io/kimonoapps/kimono-reconciler:latest

  # The Kimono app for Android, signed and attached to the release, numbered
  # from the tag so every release outranks the last (v0.7.3 → build 7003).
  # Portals offer the one matching their own version. A separate job, so a
  # problem here never holds up the CLI or the images; it skips itself when
  # the signing key isn't set.
  android:
    needs: release
    runs-on: ubuntu-latest
    # One release's phone build at a time, in order: a tag pushed while the
    # last one is still building waits for it, so it can reuse that build
    # when the phone app hasn't changed. Never cancels one already running.
    concurrency:
      group: release-android
      cancel-in-progress: false
    env:
      KEYSTORE: ${{ secrets.KIMONO_ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KIMONO_ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check for the signing key
        id: key
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Android signing key in this repository's secrets; skipping the APK."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - name: Reuse the last build if the phone app hasn't changed
        id: reuse
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then echo "No earlier release; building."; exit 0; fi
          if ! git diff --quiet "$PREV" "$GITHUB_REF_NAME" -- apps/compose .github/workflows/release-cli.yml; then echo "The phone app changed since $PREV; building."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/previous" && cd "$RUNNER_TEMP/previous"
          if ! gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p kimono-android.json; then echo "$PREV has no android build; building."; exit 0; fi
          FILE=$(jq -r .file kimono-android.json)
          gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p "$FILE"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "$FILE" kimono-android.json
          echo "Unchanged since $PREV: offering its build again."
          echo "reused=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's downloads and build cache, kept between releases.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
      - name: Build the signed APK
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        working-directory: apps/compose
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          mkdir -p ~/.config/kimono
          printf '%s' "$KEYSTORE" | base64 -d > ~/.config/kimono/android-release.jks
          printf '%s' "$KEYSTORE_PASSWORD" > ~/.config/kimono/android-release.password
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew :androidApp:assembleRelease -PkimonoBuild="$BUILD" -PkimonoVersion="$VERSION"
          rm -f ~/.config/kimono/android-release.jks ~/.config/kimono/android-release.password
          APK="kimono-$VERSION.apk"
          mv androidApp/build/outputs/apk/release/androidApp-release.apk "$APK"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK" | grep -q "CN=Kimono"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c %s "$APK")
          printf '{"version":"%s","build":%s,"file":"%s","size":%s,"sha256":"%s"}\n' "$VERSION" "$BUILD" "$APK" "$SIZE" "$SHA" > kimono-android.json
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Attach it to the release
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        working-directory: apps/compose
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber "$APK" kimono-android.json

  # The Kimono app for iPhone, built and sent to TestFlight, numbered from
  # the tag like the Android one (v0.7.3 is 0.7.3, build 7003). Signing is
  # automatic through an App Store Connect API key; internal testers get each
  # build as soon as Apple has processed it. Skips itself without the key.
  ios:
    needs: release
    runs-on: macos-latest
    # As with Android: waits for the last release's iPhone build, to reuse it.
    concurrency:
      group: release-ios
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # One .p12 (base64) holding Kimono CI's Apple Development and Apple
      # Distribution certificates, and its password. A fresh runner signing
      # automatically would otherwise ask Apple for a new certificate every
      # release, until the account runs out of them.
      IOS_SIGNING_CERT: ${{ secrets.IOS_SIGNING_CERT }}
      IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Check for the App Store Connect key
        id: key
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY" ] && [ -n "$APPLE_TEAM_ID" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No App Store Connect key in this repository's secrets; skipping the iPhone build."; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - name: Reuse the last build if the phone app hasn't changed
        id: reuse
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then echo "No earlier release; building."; exit 0; fi
          if ! git diff --quiet "$PREV" "$GITHUB_REF_NAME" -- apps/compose .github/workflows/release-cli.yml; then echo "The phone app changed since $PREV; building."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/previous" && cd "$RUNNER_TEMP/previous"
          if ! gh release download "$PREV" --repo "$GITHUB_REPOSITORY" -p kimono-ios.json; then echo "$PREV has no ios build; building."; exit 0; fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber kimono-ios.json
          echo "Unchanged since $PREV: offering its build again."
          echo "reused=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        with:
          distribution: temurin
          java-version: "21"
      # Gradle's downloads and build cache, and the Kotlin/Native toolchain
      # (about a gigabyte), kept between releases.
      - uses: gradle/actions/setup-gradle@v4
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
      - uses: actions/cache@v4
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('apps/compose/gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build and send to TestFlight
        if: steps.key.outputs.present == 'true' && steps.reuse.outputs.reused != 'true'
        working-directory: apps/compose/iosApp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))
          # The newest Xcode on the runner.
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
          xcodegen
          if [ -z "$IOS_SIGNING_CERT" ] || [ -z "$IOS_SIGNING_CERT_PASSWORD" ]; then
            echo "::error::No IOS_SIGNING_CERT in this repository's secrets; the iPhone build signs with that one certificate."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          # Apple's intermediate, so the identity's chain builds on any runner image.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -f pkcs12 -P "$IOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          KEY="$RUNNER_TEMP/asc.p8"
          printf '%s' "$ASC_KEY" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project Kimono.xcodeproj -scheme Kimono -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kimono.xcarchive" archive "${AUTH[@]}" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kimono.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
          printf '{"version":"%s","build":%s}\n' "$VERSION" "$BUILD" > "$RUNNER_TEMP/kimono-ios.json"
          gh release upload "$GITHUB_REF_NAME" --clobber "$RUNNER_TEMP/kimono-ios.json"
          echo "Kimono $VERSION ($BUILD) is on its way to TestFlight."
