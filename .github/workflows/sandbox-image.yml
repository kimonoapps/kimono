name: Kimono Code sandbox image

# Publishes the image Kimono Code's sandboxes run, whenever it changes on main.
# The tag is the one this build of Kimono expects (DefaultImage in
# cli/internal/sandbox/config.go), so bump both together.
on:
  push:
    branches: [main]
    paths:
      - infra/sandbox/**
      - cli/internal/sandbox/config.go
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the expected tag
        id: tag
        run: |
          TAG=$(sed -n 's/^const DefaultImage = "ghcr.io\/kimonoapps\/kimono-sandbox:\(.*\)"$/\1/p' cli/internal/sandbox/config.go)
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Images live under the kimonoapps organisation; see release-cli.yml.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: infra/sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kimonoapps/kimono-sandbox:${{ steps.tag.outputs.tag }}
            ghcr.io/kimonoapps/kimono-sandbox:latest
