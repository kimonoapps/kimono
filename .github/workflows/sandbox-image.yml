name: Kimono Code sandbox image

# Publishes the image Kimono Code's sandboxes run, whenever it changes on main.
# The tag is the one this build of Kimono expects (DefaultImage in
# cli/internal/sandbox/config.go), so bump both together.
#
# Each architecture builds on a runner of its own kind, side by side (no
# emulation), and keeps its layers between runs; a last step joins the two
# into one image under the tag.
on:
  push:
    branches: [main]
    paths:
      - infra/sandbox/**
      - cli/internal/sandbox/config.go
      - .github/workflows/sandbox-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kimonoapps/kimono-sandbox

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Images live under the kimonoapps organisation; see release-cli.yml.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      # Pushed by digest only: the tags go on once both architectures are in.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: infra/sandbox
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Every layer is kept between runs, so a change near the end of the
          # Dockerfile (the helpers in bin/, artifacts.md) rebuilds only what
          # follows it, not the tools and libraries above.
          cache-from: type=gha,scope=kimono-sandbox-${{ matrix.arch }}
          cache-to: type=gha,scope=kimono-sandbox-${{ matrix.arch }},mode=max
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read the expected tag
        id: tag
        run: |
          TAG=$(sed -n 's/^const DefaultImage = "ghcr.io\/kimonoapps\/kimono-sandbox:\(.*\)"$/\1/p' cli/internal/sandbox/config.go)
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Join both architectures under the tags
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            -t "$IMAGE:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.tag }}"
